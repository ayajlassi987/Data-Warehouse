services:
  postgres:
    image: postgres:16
    container_name: pubmed_dw_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pubmed_dw
      POSTGRES_USER: pubmed_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pubmed_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubmed_user -d pubmed_dw"]
      interval: 5s
      timeout: 5s
      retries: 10




  metabase:
    image: metabase/metabase:latest
    container_name: pubmed_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pubmed_data:
  metabase_data: